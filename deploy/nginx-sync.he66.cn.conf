# /etc/nginx/conf.d/sync.he66.cn.conf
#
# Reverse-proxy for SquadSync relay at sync.he66.cn.
# - Listens on 443 (HTTPS) and 80 (HTTP -> 443 redirect)
# - Passes the WebSocket Upgrade headers through to the Go backend on :7879
# - Uses a self-signed cert (replace with Let's Encrypt once you have a
#   public DNS record for sync.he66.cn)
#
# Activate:
#   sudo cp deploy/nginx-sync.he66.cn.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo firewall-cmd --permanent --add-service=https && sudo firewall-cmd --reload
#
# Let's Encrypt (after DNS for sync.he66.cn points to this box):
#   sudo dnf install -y certbot python3-certbot-nginx   # RHEL 8+
#   sudo certbot --nginx -d sync.he66.cn
# Certbot will edit this file to point at /etc/letsencrypt/live/...

# ---------- self-signed cert (replace with Let's Encrypt) ----------
# Generate once:
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -days 3650 \
#     -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/sync.he66.cn.key \
#     -out    /etc/nginx/ssl/sync.he66.cn.crt \
#     -subj "/CN=sync.he66.cn" \
#     -addext "subjectAltName=DNS:sync.he66.cn"
#   sudo openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048

# Redirect plain HTTP to HTTPS.
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name sync.he66.cn;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.he66.cn;

    ssl_certificate     /etc/nginx/ssl/sync.he66.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/sync.he66.cn.key;
    ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Logging
    access_log /var/log/nginx/sync.he66.cn.access.log;
    error_log  /var/log/nginx/sync.he66.cn.error.log warn;

    # Health / status — fast and cheap
    location = /healthz { proxy_pass http://127.0.0.1:7879/healthz; }
    location = /v1/ping  { proxy_pass http://127.0.0.1:7879/v1/ping; }
    location = /v1/stats { proxy_pass http://127.0.0.1:7879/v1/stats; }

    # The WebSocket endpoint — Android client connects to
    #   wss://sync.he66.cn/v1/rooms/<room>/ws?device=<name>
    location /v1/ {
        proxy_pass http://127.0.0.1:7879;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}